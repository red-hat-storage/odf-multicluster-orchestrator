---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: klusterlet-work-crds
rules:
  - apiGroups:
      - multicluster.odf.openshift.io
    resources:
      - appliedmanifests
      - sourcemanifests
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - multicluster.odf.openshift.io
    resources:
      - appliedmanifests/status
      - sourcemanifests/status
    verbs:
      - get
      - patch
      - update
