apiVersion: multicluster.odf.openshift.io/v1alpha1
kind: AppliedManifest
metadata:
  labels:
    app.kubernetes.io/name: odf-multicluster-orchestrator
    app.kubernetes.io/managed-by: kustomize
  name: appliedmanifest-sample
  namespace: default
spec:
  manifests:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: nginx-deployment
      labels:
        app: nginx
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: nginx
      template:
        metadata:
          labels:
            app: nginx
        spec:
          containers:
          - name: nginx
            image: nginx:1.25
            ports:
            - containerPort: 80
              name: http
            resources:
              requests:
                memory: "64Mi"
                cpu: "250m"
              limits:
                memory: "128Mi"
                cpu: "500m"
  - apiVersion: v1
    kind: Service
    metadata:
      name: nginx-service
      labels:
        app: nginx
    spec:
      type: ClusterIP
      selector:
        app: nginx
      ports:
      - port: 80
        targetPort: 80
        protocol: TCP
        name: http
status:
  phase: Applied
  observedGeneration: 1
  conditions:
  - type: Applied
    status: "True"
    lastTransitionTime: "2026-10-10T00:00:00Z"
    reason: Success
    message: All manifests applied successfully
