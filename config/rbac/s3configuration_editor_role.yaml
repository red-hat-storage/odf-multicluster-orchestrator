# This rule is not used by the project odf-multicluster-orchestrator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the multicluster.odf.openshift.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: odf-multicluster-orchestrator
    app.kubernetes.io/managed-by: kustomize
  name: s3configuration-editor-role
rules:
- apiGroups:
  - multicluster.odf.openshift.io
  resources:
  - s3configurations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - multicluster.odf.openshift.io
  resources:
  - s3configurations/status
  verbs:
  - get
