# This rule is not used by the project odf-multicluster-orchestrator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to multicluster.odf.openshift.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: odf-multicluster-orchestrator
    app.kubernetes.io/managed-by: kustomize
  name: s3configuration-viewer-role
rules:
- apiGroups:
  - multicluster.odf.openshift.io
  resources:
  - s3configurations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - multicluster.odf.openshift.io
  resources:
  - s3configurations/status
  verbs:
  - get
